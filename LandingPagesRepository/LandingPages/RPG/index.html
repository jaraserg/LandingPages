<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="City Explorer - Navigate your city like an RPG character. Discover places, connect with people, and explore your neighborhood in a unique social media experience." name="description"/>
<meta content="social media, map, RPG, exploration, local discovery, connections" name="keywords"/>
<meta content="City Explorer" name="author"/>
<title>City Explorer - RPG Social Map Adventure</title>
<!-- Leaflet CSS for Interactive Maps -->
<link crossorigin="" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" rel="stylesheet"/>
<!-- Custom Styles -->
<link href="styles.css" rel="stylesheet"/>
<!-- Leaflet JavaScript -->
<script crossorigin="" defer="" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <a href="../index.html" style="position: fixed; bottom: 20px; left: 20px; z-index: 999999; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); color: white; padding: 8px 16px; border-radius: 20px; font-family: sans-serif; font-size: 12px; font-weight: 500; border: 1px solid rgba(255,255,255,0.2); text-decoration: none; display: flex; align-items: center; gap: 6px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.3);" onmouseover="this.style.background='rgba(0,255,0,0.2)'; this.style.borderColor='rgba(0,255,0,0.5)';" onmouseout="this.style.background='rgba(0,0,0,0.8)'; this.style.borderColor='rgba(255,255,255,0.2)';"><span style="font-size: 14px;">←</span> Showcase</a>

<div id="app">
<!-- Map Container -->
<div id="map-container">
<div aria-label="Interactive city exploration map" id="map" role="application"></div>
</div>
<!-- Top Status Bar -->
<div class="ui-panel" id="top-bar">
<div class="player-stats">
<div class="stat-item">
<span class="stat-icon">📍</span>
<div>
<span class="stat-label">Places</span>
<span class="stat-value" id="stat-places">0</span>
</div>
</div>
<div class="stat-item">
<span class="stat-icon">👥</span>
<div>
<span class="stat-label">Connections</span>
<span class="stat-value" id="stat-connections">0</span>
</div>
</div>
<div class="stat-item">
<span class="stat-icon">⭐</span>
<div>
<span class="stat-label">Level</span>
<span class="stat-value" id="stat-level">1</span>
</div>
</div>
<div class="stat-item">
<span class="stat-icon">🎯</span>
<div>
<span class="stat-label">Quests</span>
<span class="stat-value" id="stat-quests">3</span>
</div>
</div>
</div>
</div>
<!-- Profile Panel -->
<div class="ui-panel" id="profile-panel">
<div class="panel-header">
<h2 class="panel-title">Player Profile</h2>
<button aria-label="Close profile panel" class="btn-icon" id="close-profile">×</button>
</div>
<div class="panel-content">
<div class="profile-header">
<img alt="Player avatar" class="profile-avatar" id="player-avatar" loading="lazy" src=""/>
<h3 class="profile-name" id="player-name">Explorer001</h3>
<p class="profile-level" id="player-level">Level 1 Wanderer</p>
</div>
<div class="profile-stats">
<div class="profile-stat">
<span class="profile-stat-value" id="profile-places">0</span>
<span class="profile-stat-label">Places Found</span>
</div>
<div class="profile-stat">
<span class="profile-stat-value" id="profile-connections">0</span>
<span class="profile-stat-label">Friends</span>
</div>
<div class="profile-stat">
<span class="profile-stat-value" id="profile-distance">0 km</span>
<span class="profile-stat-label">Traveled</span>
</div>
<div class="profile-stat">
<span class="profile-stat-value" id="profile-achievements">0</span>
<span class="profile-stat-label">Achievements</span>
</div>
</div>
</div>
</div>
<!-- Discovery Feed Panel -->
<div class="ui-panel" id="discovery-panel">
<div class="panel-header">
<h2 class="panel-title">Nearby Discoveries</h2>
<button aria-label="Close discovery panel" class="btn-icon" id="close-discovery">×</button>
</div>
<div class="panel-content" id="discovery-feed">
<!-- Discovery items will be dynamically inserted here -->
</div>
</div>
<!-- Bottom Action Bar -->
<div class="ui-panel" id="action-bar">
<button aria-label="Toggle profile" class="btn-icon" id="btn-profile" title="Profile">
        👤
      </button>
<button aria-label="Start exploring" class="btn btn-primary" id="btn-explore">
<span>🧭</span>
<span>Explore</span>
</button>
<button aria-label="View connections" class="btn-icon" id="btn-connections" title="Connections">
        👥
      </button>
<button aria-label="View quests" class="btn-icon" id="btn-quests" title="Quests">
        🎯
      </button>
<button aria-label="Settings" class="btn-icon" id="btn-settings" title="Settings">
        ⚙️
      </button>
</div>
</div>
<!-- Application Logic -->
<script src="js/app.js" type="module"></script>
<footer style="text-align: center; padding: 20px; font-size: 14px;">
<a href="#" style="text-decoration: none; color: inherit;">© 2026 Trademark</a>
</footer></body>
</html>
